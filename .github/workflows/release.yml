name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install apple-codesign
        run: |
          RCODESIGN_VERSION="0.29.0"
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo mv apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/
          rm -rf apple-codesign*

      - name: Build cross-platform binaries and packages
        run: |
          VERSION="${{ steps.tag.outputs.TAG_NAME }}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X 'main.version=${VERSION}' -X 'main.commit=${COMMIT}' -X 'main.buildTime=${BUILD_TIME}'"

          mkdir -p dist

          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for TARGET in "${TARGETS[@]}"; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            BIN_NAME="kizuna"
            ARCHIVE_EXT="tar.gz"

            if [ "$OS" == "windows" ]; then
              BIN_NAME="kizuna.exe"
              ARCHIVE_EXT="zip"
            fi

            OUTPUT_DIR="build_${OS}_${ARCH}"
            mkdir -p "${OUTPUT_DIR}"

            echo "==> Building for ${OS}/${ARCH}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build -ldflags="${LDFLAGS}" -o "${OUTPUT_DIR}/${BIN_NAME}" ./cmd/kizuna

            if [ "$OS" == "darwin" ]; then
              echo "==> Ad-hoc signing Mach-O binary for macOS (${ARCH})..."
              rcodesign sign "${OUTPUT_DIR}/${BIN_NAME}"
            fi

            cp README.md "${OUTPUT_DIR}/" 2>/dev/null || true
            cp LICENSE "${OUTPUT_DIR}/" 2>/dev/null || true

            ARCHIVE_NAME="kizuna_${VERSION}_${OS}_${ARCH}.${ARCHIVE_EXT}"
            if [ "$ARCHIVE_EXT" == "zip" ]; then
              (cd "${OUTPUT_DIR}" && zip -r "../dist/${ARCHIVE_NAME}" .)
            else
              tar -czf "dist/${ARCHIVE_NAME}" -C "${OUTPUT_DIR}" .
            fi

            rm -rf "${OUTPUT_DIR}"
          done

          # Generate SHA256 Checksums
          cd dist
          sha256sum kizuna_* > checksums.txt
          cp checksums.txt sha256sums.txt
          cd ..

      - name: Create GitHub Release with Auto Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Kizuna ${{ steps.tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
